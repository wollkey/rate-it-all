parameters:
    analyser:
        types:
            - "use"
            - "file"
            - "class"
    paths:
        - ./src
    layers:
        -
            name: Telegram
            collectors:
                -   type: directory
                    value: src/Telegram/.*
        -
            name: Game
            collectors:
                -   type: directory
                    value: src/Game/.*

    ruleset:
        Game:
            - Telegram

    formatters:
        graphviz:
            hidden_layers: [ ]
            groups: []
            point_to_groups: true