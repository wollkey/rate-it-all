name: CI

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

env:
    PHP_VERSION: '8.4'
    PHP_EXTENSIONS: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, dom, filter, json

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: test_db
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            -   name: Checkout code
                uses: actions/checkout@v5

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ env.PHP_VERSION }}
                    extensions: ${{ env.PHP_EXTENSIONS }}
                    coverage: xdebug

            -   name: Get Composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Cache Composer dependencies
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                    restore-keys: ${{ runner.os }}-composer-

            -   name: Install dependencies
                run: composer install --prefer-dist --no-progress --no-interaction

            # --- Composer checks ---

            -   name: Validate composer.json
                run: make composer-validate

            -   name: Security audit
                run: make composer-audit

            -   name: Check unused dependencies
                run: make composer-unused

            # --- Code quality ---

            -   name: PHP CS Fixer
                run: make lint-check

            -   name: Rector
                run: make rector-check

            -   name: PHPStan
                run: make stan

            # --- Tests ---

            -   name: PHPUnit
                run: make test
                env:
                    DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

            # --- Symfony prod container ---

            -   name: Symfony container warmup (prod)
                run: php bin/console cache:warmup --env=prod --no-debug
#                env:
#                    APP_ENV: prod
#                    APP_SECRET: ci-build-secret-not-used-in-production
#                    DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
