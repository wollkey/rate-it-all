version: "3.9"

services:
    web:
        container_name: game_web
        image: nginx:latest
        ports:
            - "80:80"
        volumes:
            - .docker/nginx/server.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php

    php:
        container_name: game_php
        image: pirojok/game-rating:latest
        depends_on:
            - postgres

    postgres:
        container_name: game_db
        image: postgres:latest
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
        volumes:
            - postgres-data:/var/lib/postgresql/data:rw

    redis:
        container_name: game_redis
        image: redis:latest

volumes:
    postgres-data:
        driver: local
