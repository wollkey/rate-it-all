services:
    web:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            target: development
        container_name: game_web
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./.docker/caddy/Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - postgres
            - redis

    postgres:
        container_name: game_db
        image: postgres:latest
        environment:
            POSTGRES_DB: rate_it_all
            POSTGRES_PASSWORD: secret
            POSTGRES_USER: alex
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        container_name: game_redis
        image: redis:latest
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
    redis_data:
    caddy_data:
    caddy_config:
