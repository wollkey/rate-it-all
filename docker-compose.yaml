version: "3.9"

services:
    postgres:
        container_name: game_db
        image: postgres:latest
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
        volumes:
            - postgres-data:/var/lib/postgresql/data:rw

    redis:
        container_name: game_redis
        image: redis:latest

volumes:
    postgres-data:
        driver: local
